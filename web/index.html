<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8ef">
  <meta name="description" content="随手来一局 2048。滑动合并，自动保存，随时继续。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <title>2048 · 随手来一局</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main class="game">
    <header>
      <div><p class="eyebrow">随手来一局</p><h1>2048<span>.</span></h1></div>
      <div class="score-box"><span>当前得分</span><strong id="score">0</strong><span id="gain" aria-hidden="true"></span></div>
    </header>
    <div class="intro"><p>滑动方块，<b>合成 2048</b></p><span class="edition">触屏版</span></div>
    <div class="toolbar">
      <button id="undo" class="secondary" disabled><span aria-hidden="true">↶</span> 撤销一步</button>
      <button id="restart" class="primary">重新开始 <span aria-hidden="true">↗</span></button>
    </div>
    <div id="board" class="board" role="grid" aria-label="2048 棋盘，在此上下左右滑动" tabindex="0"></div>
    <p id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></p>
    <div class="below-board"><p id="status" role="status">进度自动保存在此浏览器</p><button id="sound" class="sound-button" aria-pressed="true" aria-label="合并音效：开启">音效 开</button></div>
    <div class="direction-controls" aria-label="点按方向移动">
      <button data-direction="left" aria-label="向左移动">←</button>
      <button data-direction="up" aria-label="向上移动">↑</button>
      <button data-direction="down" aria-label="向下移动">↓</button>
      <button data-direction="right" aria-label="向右移动">→</button>
    </div>
    <footer><p>在棋盘上滑动，或点按方向按钮</p><p>相同数字相遇即可合并 · 也支持方向键 / WASD</p></footer>
    <noscript>请启用浏览器 JavaScript 后游玩。</noscript>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <div class="dialog-icon" aria-hidden="true">2048</div>
    <h2 id="dialog-title"></h2><p id="dialog-description"></p>
    <div class="dialog-actions"><button id="dialog-secondary" class="secondary"></button><button id="dialog-primary" class="primary"></button></div>
  </dialog>
</body>
</html>
